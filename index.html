<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeBonCoin - Marketplace</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="content">
            <!-- Logo/Header -->
            <h1>Bienvenue sur LeBonCoin</h1>
            <p class="subtitle">La plateforme de vente d'occasion n°1 en France</p>
            
            <!-- Description -->
            <p class="description">
                Découvrez des milliers d'annonces pour acheter et vendre d'occasion près de chez vous.
            </p>
            
            <!-- Main Button -->
            <button class="redirect-btn" onclick="redirectToLeBonCoin()">
                Accéder à LeBonCoin
            </button>
            
            <!-- Footer with Legal Links -->
            <footer class="footer">
                <p>
                    <a href="privacy.html" target="_blank">Politique de Confidentialité</a>
                </p>
            </footer>
        </div>
    </div>
    
    <!-- JavaScript for Redirect -->
    <script>
        function redirectToLeBonCoin() {
            // Redirect to LeBonCoin
            window.location.href = "https://www.leboncoin.fr";
        }
    </script>
</body>
</html>
